<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sensory AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --primary: #00ff88;
      --secondary: #7000ff;
      --dark: #0a0a0a;
      --dark-gray: #1a1a1a;
      --light: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--dark);
      color: var(--light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .dashboard {
      width: 100%;
      max-width: 1200px;
      padding: 0 1rem;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      height: 600px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
      background: var(--dark-gray);
      border: 2px solid var(--dark-gray);
      transition: all 0.3s ease;
      margin-bottom: 1rem;
    }

    #videoContainer:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.2);
    }

    #videoFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
    }

    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: var(--dark);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .btn:disabled {
      background: var(--dark-gray);
      color: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #summaryResult {
      margin-top: 1rem;
      width: 100%;
      background: var(--dark-gray);
      padding: 2rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
    }

    #summaryResult::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background: linear-gradient(transparent, var(--dark-gray));
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 1rem;
      z-index: 2;
    }

    .status-item {
      background: rgba(0, 0, 0, 0.5);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.8; }
      50% { opacity: 0.4; }
      100% { opacity: 0.8; }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--dark-gray);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    .glow-text {
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    /* Responsive design */
    @media (max-width: 768px) {
      #videoContainer {
        height: 400px;
      }
    }

    @media (max-width: 480px) {
      #videoContainer {
        height: 300px;
      }
      .btn {
        padding: 0.75rem 1.5rem;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1 class="glow-text" style="margin-bottom: 2rem;">Sensory AI <i class="fas fa-robot"></i></h1>
    
    <div id="videoContainer">
      <div class="status-bar">
        <div class="status-item">
          <i class="fas fa-circle pulse" style="color: var(--primary);"></i>
          <span>LIVE FEED</span>
        </div>
      </div>
      <img id="videoFeed" src="https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif" alt="Video Feed">
    </div>

    <div class="controls">
      <button class="btn" id="startButton">
        <i class="fas fa-play"></i>
        Start Camera
      </button>
      <button class="btn" id="stopButton" disabled>
        <i class="fas fa-stop"></i>
        Stop Camera
      </button>
      <button class="btn" id="summaryButton">
        <i class="fas fa-brain"></i>
        Generate Summary
      </button>
    </div>

    <div id="summaryResult"></div>
  </div>

  <script>
    const startButton = document.getElementById('startButton');
    const stopButton = document.getElementById('stopButton');
    const summaryButton = document.getElementById('summaryButton');
    const videoFeed = document.getElementById('videoFeed');
    const summaryResult = document.getElementById('summaryResult');
    const placeholderGif = "https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif";

    // Format the summary text into bullet points using regex-based splitting
    function formatSummary(text) {
      // Split by newlines (one or more) and filter out empty lines
      let lines = text.split(/\n+/).filter(line => line.trim() !== "");
      let formatted = "<ul>";
      for (let line of lines) {
        // Remove any common bullet markers and extra whitespace
        line = line.replace(/^[-*•\s]+/, "").trim();
        formatted += `<li>${line}</li>`;
      }
      formatted += "</ul>";
      return formatted;
    }

    startButton.addEventListener('click', function() {
      fetch('/start_camera', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          videoFeed.src = '/video_feed';
          startButton.disabled = true;
          stopButton.disabled = false;
          videoFeed.style.border = `2px solid var(--primary)`;
        })
        .catch(error => console.error('Error starting camera:', error));
    });

    stopButton.addEventListener('click', function() {
      fetch('/stop_camera', { method: 'POST' })
        .then(response => response.json())
        .then(data => {
          videoFeed.src = placeholderGif;
          startButton.disabled = false;
          stopButton.disabled = true;
          videoFeed.style.border = 'none';
        })
        .catch(error => console.error('Error stopping camera:', error));
    });

    summaryButton.addEventListener('click', function() {
      summaryResult.innerHTML = '<div class="status-item"><i class="fas fa-spinner fa-spin"></i> Analyzing observations...</div>';
      
      fetch('/summary')
        .then(response => response.json())
        .then(data => {
          if(data.summary){
            let formattedSummary = formatSummary(data.summary);
            summaryResult.innerHTML = `
              <div class="status-item" style="margin-bottom: 1rem;">
                <i class="fas fa-clipboard-check"></i>
                Analysis Complete
              </div>
              ${formattedSummary}
            `;
          } else {
            summaryResult.innerHTML = `<div class="status-item" style="color: #ff5555;">
              <i class="fas fa-exclamation-triangle"></i>
              Error: ${data.error || 'Unknown error'}
            </div>`;
          }
        })
        .catch(error => {
          summaryResult.innerHTML = `<div class="status-item" style="color: #ff5555;">
            <i class="fas fa-exclamation-triangle"></i>
            Connection Error
          </div>`;
          console.error('Error generating summary:', error);
        });
    });
  </script>
</body>
</html>
